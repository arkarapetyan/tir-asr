[project]
name = "tir-asr"
version = "0.1.0"
description = "Live Armenian speech transcription and English translation in the terminal, with speaker labels. Local models only."
readme = "README.md"
authors = [{ name = "Aren" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
tir-asr = "tir_asr.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.uv]
# One uv version on the laptop, in CI, and in the workspace (D-009).
# setup-uv in CI reads this value.
required-version = "==0.12.21"
# The group "laptop" has the packages that need the GPU or the audio server.
# The laptop installs it by default. CI excludes it with --no-group laptop (D-021).
default-groups = ["dev", "laptop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra", "-m", "not model and not sim"]
markers = [
    "model: loads a real model; runs on Aren's laptop only",
    "sim: plays audio into virtual audio devices; runs on Aren's laptop only",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "sacrebleu>=2.6.0",
    "scipy>=1.18.1",
]
laptop = [
    "ctranslate2>=4.8.3",
    "huggingface-hub>=2.3.0",
    "nemo-toolkit[asr]>=3.0.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "sentencepiece>=0.2.2",
    "silero-vad>=6.2.3",
    "soundcard>=0.4.6",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]
