[project]
name = "tir-asr"
version = "0.1.0"
description = "Live Armenian speech transcription and English translation in the terminal, with speaker labels. Local models only."
readme = "README.md"
authors = [{ name = "Aren" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra", "-m", "not model and not sim"]
markers = [
    "model: loads a real model; runs on Aren's laptop only",
    "sim: plays audio into virtual audio devices; runs on Aren's laptop only",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
